name: Backend CI

on:
  push:
    branches: ["master"]
    paths:
      - "resume-parser-core/**"
      - ".github/workflows/backend-ci.yaml"
  pull_request:
    branches: ["master"]
    paths:
      - "resume-parser-core/**"
      - ".github/workflows/backend-ci.yaml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./resume-parser-core
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up ruff
        uses: astral-sh/ruff-action@v3

      - name: Run ruff check and lint
        run: |
          ruff check --fix
          ruff format

  test:
    needs: ruff
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: ./resume-parser-core

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with pytest
        run: pytest

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: development
    env:
      REGISTRY: ${{ vars.REGISTRY }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./resume-parser-core
          file: ./resume-parser-core/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.NAMESPACE }}/resume-parser-core:latest
            ${{ env.REGISTRY }}/${{ secrets.NAMESPACE }}/resume-parser-core:${{ github.sha }}
          cache-from: type=gha,scope=resume-parser-core
          cache-to: type=gha,mode=min,scope=resume-parser-core

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl $deploy_url
