name: Backend CI

on:
  push:
    branches: ["master"]
    paths:
      - "resume-parser-core/*"
      - ".github/workflows/backend-ci.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development
    env:
      REGISTRY: ${{ vars.REGISTRY }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./resume-parser-core
          file: ./resume-parser-core/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.NAMESPACE }}/resume-parser-core:latest
          cache-from: type=gha,scope=resume-parser-core
          cache-to: type=gha,mode=min,scope=resume-parser-core

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl $deploy_url
